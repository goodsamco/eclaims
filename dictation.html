<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dictation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050805;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#fff;--muted:#9a9a9a;--good:hsl(111,100%,60%);--bad:#ff4d4d;--warn:#f0a000;--onaccent:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
.app{--accent:var(--good);position:relative;z-index:1;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 20px 16px}
.app.weak{--accent:var(--warn)}
.app.off{--accent:var(--bad)}

.conn{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:600 .8rem Inter,sans-serif}
.light{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent),0 0 12px var(--accent)}
.app.weak .light{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}

.stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.orb{position:relative;width:min(80vw,320px,52vh);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.orb[disabled]{cursor:default}
.orb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.orb canvas{width:100%;height:100%;display:block}
.core{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);pointer-events:none}
.core svg{width:56px;height:56px}
.hint{font-size:.85rem;color:var(--muted);text-align:center;height:5.2em;max-width:30ch}
.lt{width:100%;max-width:34ch;height:3.6rem;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.lt span{font:400 .8rem/1.4 Inter,sans-serif;color:var(--muted);text-align:center;word-break:break-word;letter-spacing:.3px}
.hint.err{color:var(--bad)}
.hint strong{display:block;color:var(--accent);font-weight:600;font-size:1.05rem}

.result{display:none;flex:1;min-height:0;width:100%;flex-direction:column;gap:14px;padding-top:16px}
.app.done .stage{display:none}
.app.done .result{display:flex}
.card{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:18px 6px 22px 4px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%)}
/* modern scrollbar: slim, rounded, tinted with the accent, brighter on hover */
.card,.sgi,.hp{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent,var(--good)) 28%,transparent) transparent}
.card:hover,.sgi:hover{scrollbar-color:color-mix(in srgb,var(--accent,var(--good)) 60%,transparent) transparent}
.card::-webkit-scrollbar,.sgi::-webkit-scrollbar{width:8px}
.card::-webkit-scrollbar-track,.sgi::-webkit-scrollbar-track{background:transparent;margin:18px 0}
.card::-webkit-scrollbar-thumb,.sgi::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent,var(--good)) 28%,transparent);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.card::-webkit-scrollbar-thumb:hover,.sgi::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--accent,var(--good)) 65%,transparent);background-clip:padding-box}
#txt{position:relative;margin:auto 0;text-align:left;font:600 1.15rem/1.6 Poppins,sans-serif;letter-spacing:.3px;word-break:break-word}
.w{display:inline-block;animation:rev .45s ease-out both}
@keyframes rev{from{filter:blur(12px);opacity:0;transform:translateY(4px)}to{filter:blur(0);opacity:1;transform:none}}
.fin{display:block;margin-top:14px;color:var(--muted);font:400 .75rem Inter,sans-serif}
.row{display:flex;gap:10px}
.btn{flex:1;height:56px;border-radius:28px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 .95rem Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn:focus-visible,.orb:focus-visible,.hb:focus-visible,.hi:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#mic{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;font-size:16px}

/* desktop history: invisible until the top-right corner is hovered */
.hz{display:none;position:fixed;top:0;right:0;padding:14px 16px 0 40px;opacity:0;transition:opacity .25s;z-index:10}
body.desk .hz{display:block}
.hz:hover,.hz:focus-within{opacity:1}
.hb{width:40px;height:40px;margin-left:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--accent);cursor:pointer}
.hb svg{width:18px;height:18px}
.hp{display:none;position:absolute;right:16px;top:54px;width:min(340px,86vw);padding:10px;border-radius:24px;background:rgba(13,13,13,.92);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hz:hover .hp,.hz:focus-within .hp{display:block}
.hp h2{margin:4px 8px 8px;font:600 .75rem Inter,sans-serif;color:var(--muted)}
.hi{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:16px;background:none;color:var(--text);cursor:pointer;font:600 .8rem/1.4 Poppins,sans-serif}
.hi:hover{background:var(--panel)}
.hi span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hi small{display:block;margin-top:2px;color:var(--muted);font:400 .7rem Inter,sans-serif}
.empty{padding:10px 12px;color:var(--muted);font-size:.8rem}
.w.u-bad,.w.u-warn{cursor:pointer;text-decoration:underline dashed;text-decoration-thickness:1px;text-underline-offset:6px}
.w.u-bad{text-decoration-color:color-mix(in srgb,var(--bad) 65%,transparent)}
.w.u-warn{text-decoration-color:color-mix(in srgb,var(--warn) 70%,transparent)}
.ok{display:inline-block;width:.95rem;height:.95rem;margin-left:7px;vertical-align:-.2rem;color:var(--good)}
.ok svg{width:100%;height:100%;display:block}
.pop{position:fixed;z-index:30;min-width:170px;max-width:260px;padding:8px;border-radius:20px;background:rgba(18,18,18,.96);border:1px solid var(--line);box-shadow:0 12px 36px rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.pop[hidden]{display:none}
.pop h3{margin:4px 8px 6px;font:400 .72rem/1.3 Inter,sans-serif;color:var(--muted)}
.pop button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:14px;background:none;color:var(--text);font:600 .8rem Poppins,sans-serif;cursor:pointer}
.pop button:hover,.pop button:focus-visible{background:var(--panel);outline:none}
.pop button.keep{color:var(--muted);font:400 .8rem Inter,sans-serif}
.pop .pn{margin:0 8px 6px;font:400 .7rem/1.3 Inter,sans-serif;color:var(--muted)}
.pop .none{padding:6px 12px;font:400 .78rem Inter,sans-serif;color:var(--muted)}
.pop .sep{height:1px;margin:6px 8px;background:var(--line)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;filter:blur(26px);opacity:.15;background:radial-gradient(circle 48vmin at 50% 44%,color-mix(in srgb,var(--glow,var(--good)) 55%,transparent),transparent 100%),radial-gradient(circle 24vmin at 50% 44%,color-mix(in srgb,var(--glow,var(--good)) 40%,transparent),transparent 100%)}
#ed{position:absolute;left:0;top:0;width:100%;height:1.6em;visibility:hidden;margin:0;padding:0;background:transparent;border:0;outline:0;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;color:var(--text);caret-color:transparent;font:600 1.15rem/1.6 Poppins,sans-serif;letter-spacing:.3px}
#txt.editing #words{white-space:pre-wrap}
#txt.editing #words .w{color:transparent;animation:none;pointer-events:none}   /* words stay invisible, only the dashed review marks remain under the typed text */
#txt.editing #ed{visibility:visible;caret-color:var(--accent)}
.swipe{align-self:center;display:flex;align-items:center;gap:6px;padding:6px 12px;border:0;border-radius:999px;background:none;color:var(--muted);font:400 .72rem Inter,sans-serif;cursor:pointer}
.swipe svg{width:14px;height:14px;transition:transform .3s}
.swipe.on svg{transform:rotate(180deg)}
.sg{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .6s cubic-bezier(.22,1,.36,1),opacity .4s ease,visibility 0s .6s}
.sgi{min-height:0;max-height:38vh;overflow-y:auto;padding:10px 6px 30px 0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12px,#000 calc(100% - 30px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 12px,#000 calc(100% - 30px),transparent 100%);overscroll-behavior:contain}
.sg.open{grid-template-rows:1fr;opacity:1;visibility:visible;transition:grid-template-rows .6s cubic-bezier(.22,1,.36,1),opacity .4s ease,visibility 0s}
.sgw{display:grid;grid-template-rows:1fr;animation:grow .65s cubic-bezier(.22,1,.36,1) both}
.sgw>div{min-height:0;overflow:hidden}
@keyframes grow{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
.src{margin-top:4px;color:var(--muted);font:400 .68rem/1.4 Inter,sans-serif;opacity:.8}
.sgs{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 4px 2px;color:var(--muted);font:400 .74rem Inter,sans-serif;animation:rise .5s ease-out both}
.sgs i{width:7px;height:7px;border-radius:50%;background:var(--accent,var(--good));animation:pulse .8s ease-in-out infinite alternate}
.sgc{display:block;width:100%;text-align:left;padding:14px 2px 13px;margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--text);cursor:pointer;animation:rise .6s cubic-bezier(.22,1,.36,1) both;}
.sgc:focus-visible{outline:2px solid var(--accent,var(--good));outline-offset:-2px;border-radius:8px}
.sgt{font:600 .9rem/1.5 Poppins,sans-serif;word-break:break-word}
.sgt .w.chg{color:var(--accent)}
.sgn{color:var(--muted);font-size:.8rem;padding:10px 4px}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){.w,.sgc,.sgw{animation:none}.sg,.sg.open{transition:none}}
</style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="hz" id="hz">
  <button class="hb" aria-label="Copy history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
  <div class="hp"><h2>Last 5 copied</h2><div id="hl"></div></div>
</div>

<div class="app" id="app">
  <div class="conn"><span class="light"></span><span id="connLbl">Disconnected</span></div>

  <section class="stage">
    <button class="orb" id="orb" aria-label="Start dictation">
      <canvas id="mx" width="640" height="640"></canvas>
      <div class="core" id="core"></div>
    </button>
    <div class="hint" id="hint"></div>
    <div class="lt"><span id="lt"></span></div>
  </section>

  <section class="result">
    <div class="card" id="card"><div id="txt"></div><textarea id="ed" rows="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Edit text"></textarea></div>
    <button class="swipe" id="swipe" aria-label="See suggestions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg><span id="swipeLbl">See suggestions</span></button>
    <div class="sg" id="sg"><div class="sgi" id="sgi"></div></div>
    <div class="row">
      <button class="btn main" id="bCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span>Copy</span></button>
      <button class="btn" id="bReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Reset</button>
    </div>
  </section>

  <textarea id="mic" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Dictation input"></textarea>
</div>

<script type="module">

let state = 'idle', link = 'off', dictated = '', finish = '', prevRemote = '';
let liveText = '', keyMode = false, rec = null, committed = '', session = '', stopping = false;
let paused = false, held = false, holdT = null, pausedValue = '';

/* ---------- helpers ---------- */
const clean = s => s.toUpperCase().replace(/[^A-Z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
/* ---------- phrase fixes: turns common mishearings into your standard wording ---------- */
const PHRASES = [
  ['ONSET', ['IF ON SET', 'IF ONSET', 'ON SET']],

const NUMW = {ZERO:0,ONE:1,TWO:2,THREE:3,FOUR:4,FIVE:5,SIX:6,SEVEN:7,EIGHT:8,NINE:9,TEN:10,ELEVEN:11,TWELVE:12,THIRTEEN:13,FOURTEEN:14,FIFTEEN:15,SIXTEEN:16,SEVENTEEN:17,EIGHTEEN:18,NINETEEN:19,TWENTY:20,THIRTY:30,FORTY:40,FIFTY:50,SIXTY:60,SEVENTY:70,EIGHTY:80,NINETY:90};
const NUMRE = new RegExp('\\b((?:TWENTY|THIRTY|FORTY|FIFTY|SIXTY|SEVENTY|EIGHTY|NINETY)(?: (?:ONE|TWO|THREE|FOUR|FIVE|SIX|SEVEN|EIGHT|NINE))?|' + Object.keys(NUMW).join('|') + ') (YEARS?|MONTHS?|WEEKS?|DAYS?|HOURS?)\\b', 'g');

const fix = t => PHRASES.reduce((x, [re, to]) => x.replace(re, to), numFix(t)).replace(DUPDUR, '$1').replace(PRIORFIX, '$1 PRIOR TO ADMISSION');

const clock = d => { let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return two(h) + ':' + two(d.getMinutes()) + ' ' + ap; };

/* ---------- medical words + quiet review marks ---------- */
const LEX = new Set(`ONSET DYSPNEA DIAPHORESIS TACHYCARDIA BRADYCARDIA TACHYPNEA HEMOPTYSIS HEMATEMESIS MELENA HEMATURIA DYSURIA POLYURIA POLYDIPSIA POLYPHAGIA PALPITATIONS SYNCOPE VERTIGO NAUSEA PRURITUS EDEMA ERYTHEMA CYANOSIS PALLOR JAUNDICE LETHARGY MALAISE ANOREXIA DYSPHAGIA ODYNOPHAGIA ORTHOPNEA PAROXYSMAL ARTHRALGIA MYALGIA PHOTOPHOBIA HEMIPARESIS HEMIPLEGIA PARESTHESIA AFEBRILE

ECG EKG TROPONIN CBC URINALYSIS XRAY RADIOGRAPH ULTRASOUND CT MRI CREATININE BUN SGPT SGOT HBA1C FBS RBS

const ignored = new Set(); try { JSON.parse(localStorage.getItem('dictIgnore') || '[]').forEach(k => ignored.add(k)); } catch (e) {}
let typo = null, dictReady = false, marksCache = [];

/* general English dictionary (Typo.js + Hunspell en_US), loaded in the background; marks stay quiet until it is ready */
function loadScript(urls) { return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => { const el = document.createElement('script'); el.src = u; el.onload = res; el.onerror = rej; document.head.appendChild(el); })), Promise.reject()); }
async function loadDict() {
  try {
    await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/typo-js/1.2.4/typo.min.js', 'https://cdn.jsdelivr.net/npm/typo-js@1.2.4/typo.js']);
    for (const v of ['3.2.0', '4.0.0']) {
      try {
        const [aff, dic] = await Promise.all(['aff', 'dic'].map(x => fetch(`https://cdn.jsdelivr.net/npm/dictionary-en@${v}/index.${x}`).then(r => { if (!r.ok) throw 0; return r.text(); })));
        typo = new Typo('en_US', aff, dic, { platform: 'any' }); dictReady = true;

}

/* ---------- account styling (same accounts doc) ---------- */
if (userId && db) {
  onSnapshot(doc(db, "accounts", userId), snap => {
    if (snap.exists() && snap.data().btnValue) document.documentElement.style.setProperty('--good', snap.data().btnValue);
  });
}

/* ---------- actions ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;   // native dictation when the browser has it

/* join text from a restarted recognizer without repeating what it already gave us */

/* ONE engine per session. It is chosen at the start and kept even if it fails.

function pickEngine() {

}

}

function startDictation() {

function finishDictation() {

orb.addEventListener('click', () => {
  if (role !== 'phone' || !userId) return;
  if (held) { held = false; return; }
  if (state === 'idle' && link === 'on') startDictation();
  else if (state === 'live') finishDictation();
});
mic.addEventListener('input', () => {
  if (paused) { mic.value = pausedValue; return; }
  const v = mic.value.toUpperCase().replace(/[^A-Z0-9\s]/g, '').replace(/\s{2,}/g, ' ');
  if (v !== mic.value) mic.value = v;
  if (state === 'live' && keyMode) { liveTx(v); pulse(.3); }
});

/* ---------- hold the matrix to pause, release to continue, tap to finish ---------- */
function pauseDict() {
  if (state !== 'live' || paused) return;
  paused = true; held = true; pausedValue = mic.value;
  if (rec) { killRec(); committed = joinText(committed, session); session = ''; }
  if (navigator.vibrate) navigator.vibrate(20);
  paint();
}
function resumeDict() {
  if (!paused) return;
  paused = false; locked = false;
  if (!keyMode && !failed) { stopping = false; try { startNative(); } catch (e) { failNative(); } }
  paint();
}
let sy = 0, swiped = false;
orb.addEventListener('pointerdown', e => {
  if (role !== 'phone' || state !== 'live') return;
  sy = e.clientY; swiped = false; held = false; clearTimeout(holdT);
  if (!locked) holdT = setTimeout(pauseDict, 350);
  try { orb.setPointerCapture(e.pointerId); } catch (x) {}
});
orb.addEventListener('pointermove', e => {
  if (role !== 'phone' || state !== 'live' || swiped) return;
  const dy = e.clientY - sy;
  if (paused && !locked && dy > 45) { locked = true; swiped = true; held = true; if (navigator.vibrate) navigator.vibrate([15, 40, 15]); paint(); }

['pointerup', 'pointercancel'].forEach(n => orb.addEventListener(n, () => { clearTimeout(holdT); if (paused && !locked) resumeDict(); }));
orb.addEventListener('contextmenu', e => e.preventDefault());

async function copyText(t, btnSpan) {
  try { await navigator.clipboard.writeText(t); } catch (e) {}
  if (btnSpan) { const o = btnSpan.textContent; btnSpan.textContent = 'Copied'; setTimeout(() => { btnSpan.textContent = o; }, 1200); }
}
$('bCopy').addEventListener('click', async () => {
  const t = dictated;
  copyText(t, $('bCopy').querySelector('span'));
  if (role === 'desktop') logHistory(dictated, finish);
});
$('bReset').addEventListener('click', () => { state = 'idle'; dictated = ''; finish = ''; mic.value = ''; paint(); pushSession('idle'); });

/* ---------- desktop copy history: keep 5, delete the rest ---------- */
async function logHistory(text, fin) {
  if (!rtdb || !userId || !text) return;
  try {
    const h = ref(rtdb, base + '/history');
    await push(h, { text, finish: fin, copiedAt: serverTimestamp() });
    const snap = await get(h), items = [];
    snap.forEach(c => { items.push({ k: c.key, t: c.val().copiedAt || Date.now() }); });
    items.sort((a, b) => b.t - a.t);
    items.slice(5).forEach(i => remove(ref(rtdb, `${base}/history/${i.k}`)));
  } catch (e) { console.warn("History sync failed."); }
}
if (role === 'desktop' && rtdb && userId) {
  onValue(ref(rtdb, base + '/history'), s => {
    const list = [], box = $('hl'); box.textContent = '';
    s.forEach(c => { list.push(c.val()); });
    list.sort((a, b) => (b.copiedAt || 0) - (a.copiedAt || 0));
    if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing copied yet'; box.appendChild(e); return; }
    list.slice(0, 5).forEach(it => {
      const b = document.createElement('button'); b.className = 'hi';
      const sp = document.createElement('span'); sp.textContent = it.text || '';
      const sm = document.createElement('small'); sm.textContent = it.copiedAt ? clock(new Date(it.copiedAt)) : '';
      b.append(sp, sm);
      b.addEventListener('click', () => { copyText(it.text || ''); sm.textContent = 'Copied'; setTimeout(() => { sm.textContent = it.copiedAt ? clock(new Date(it.copiedAt)) : ''; }, 1000); });
      box.appendChild(b);
    });
  });
}

/* ---------- keyboard-safe layout ---------- */
if (window.visualViewport) { const vv = window.visualViewport; const fit = () => { app.style.height = vv.height + 'px'; }; vv.addEventListener('resize', fit); fit(); }

/* ---------- dot matrix (reacts to your speech on the phone; plain ripple on desktop) ---------- */
const cv = $('mx'), cx = cv.getContext('2d'), glow = $('glow'), S = 640, C = S / 2, dots = [];
for (let r = 22; r <= 300; r += 29) {
  const n = Math.max(1, Math.round(2 * Math.PI * r / 26));
  for (let k = 0; k < n; k++) { const a = k / n * 6.2832; dots.push({ x: C + r * Math.cos(a), y: C + r * Math.sin(a), c: Math.cos(a), r, a, b: r < 120 ? 0 : r < 210 ? 1 : 2 }); }
}
let lvl = 0; const bnd = [0, 0, 0];
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
function draw(t) {

    tb = [e * (.6 + .4 * Math.sin(t / 410)), e * (.7 + .3 * Math.sin(t / 260 + 2)), e * (.5 + .5 * Math.sin(t / 180 + 4))];
