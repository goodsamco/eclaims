<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLANG GOOD SAMARITAN HOSPITAL, CO. - CF4 and OPERATION RECORD</title>
<style>
@page{size:8.5in 13in;margin:0}
*{box-sizing:border-box}
:root{--bg:#e9edf1;--ink:#17323f;--acc:#1f6f78;--line:#8a8a8a}
@media(prefers-color-scheme:dark){:root{--bg:#1d252b;--ink:#e4eef2;--acc:#5fb4bd}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,sans-serif}
.ui{max-width:860px;margin:0 auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:58px;height:58px;border-radius:50%}.brand b{display:block;font-size:22px;line-height:1.15;letter-spacing:.2px}.top h2{margin:2px 0 0;font-size:12.5px;font-weight:500;opacity:.8}
.bar{height:6px;background:#0002;border-radius:3px;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .2s}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid #0003;display:flex;flex-wrap:nowrap;gap:8px;justify-content:center;padding:10px 8px}.nav button{white-space:nowrap;padding:8px 14px}body{padding-bottom:64px}
button{font:inherit;padding:8px 18px;border:1px solid var(--acc);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
button.p{background:var(--acc);color:#fff}
button.d{border-color:#b3412f;color:#b3412f}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tools button{padding:4px 10px;font-size:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.sheet{display:flex;flex-direction:column;align-items:center;gap:24px;overflow-x:auto;padding:8px 40px}
/* ---- CF4 paper ---- */
.pg{width:816px;height:1248px;min-width:816px;background:#fff;color:#000;padding:36px;display:flex;flex-direction:column;font:9.5px/1.25 Tahoma,Verdana,Arial,sans-serif;position:relative;box-shadow:0 2px 12px #0004;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg input,.pg textarea{font:inherit;color:#000;background:transparent;border:0;border-bottom:1px solid #ccc;padding:0 2px;width:100%;min-width:0;border-radius:0}
.pg textarea{border:0;resize:none;height:100%;display:block}
.pg input:focus,.pg textarea:focus{background:#fff8c6}
input[type=date].e{color:transparent}input[type=date].e:focus{color:#000}
.hd{display:flex;justify-content:space-between;height:58px}
.logo img{display:block;height:54px;width:auto;margin-left:6px}.logo b{font:bold 30px Arial,sans-serif;color:#2a4a5c;letter-spacing:-.5px;margin-left:30px}.logo i{display:block;font:italic 9px Georgia,serif;margin-left:36px;color:#444}
.tr{text-align:right;font-size:9px}.tr h1{margin:0;font:bold 21px Arial;line-height:1}.tr b{font-size:10.5px;line-height:1.15;display:block}
.ser{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-weight:bold;font-size:10px;height:14px}
.ser input{width:190px;letter-spacing:6.3px;border:0;border-bottom:1px solid #666;background:repeating-linear-gradient(90deg,transparent 0 14px,#777 14px 15px)}
.rem{margin:3px 0 2px;font-size:9px;line-height:1.3}.rem u{text-decoration:none;font-weight:bold}
.box{border:1px solid var(--line)}
.sec{text-align:center;font-weight:bold;font-size:9.5px;padding:2px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.box>.sec:first-child{border-top:0}
.g{display:grid}.c{padding:3px 5px;border-bottom:1px solid var(--line)}.l{border-left:1px solid var(--line)}
.c>b,.lb{font-weight:bold;font-size:9.5px}
.sm{display:grid;font-size:6.5px;text-align:center;color:#444}
.sm span{border-top:1px solid #bbb;margin:0 2px}
.cb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cb input{position:relative;appearance:none;-webkit-appearance:none;width:15px;height:17px;border:1px solid #888 !important;border-radius:1px;margin:0;padding:0;display:grid;place-items:center;background:#fff !important;flex:none}
.cb input:checked::after{content:"\2714";font-size:13px;line-height:1;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cb.big input{width:19px;height:21px}
.cb input.chk{height:15px}
.u{display:inline-block}
.dbx{display:inline-flex;align-items:flex-start;gap:3px}.dbx input{text-align:center;border:1px solid #aaa;border-top:0;width:100%;height:16px}.dc{display:inline-flex;flex-direction:column;align-items:center;width:30px}.dc.y{width:50px}.dc i{font:normal 6.5px Arial;color:#444;text-align:center;margin-top:1px}.ds{font-weight:normal;line-height:16px}
.cks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px 8px;padding:5px 12px 6px}
.row4{display:grid;grid-template-columns:92px 152px 152px 148px minmax(0,1fr);gap:5px 6px;align-items:center;padding:3px 2px 0 14px}
.row4 .oth{grid-column:2/6;display:flex;gap:4px;align-items:center;margin-bottom:3px}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border:1px solid var(--line);padding:0;height:21px;font-weight:normal;position:relative}
table.t th{height:19px;font-size:9.5px}
table.t input{border:0;height:19px}
.nb{display:none}
body.s1 #p2,body.s2 #p1{display:none}
.pg>*{flex:none}
#p1>.box{display:flex;flex-direction:column;flex:1 1 0;min-height:0}
#p1>.box>*{flex:none}
#p1>.box>.grow{flex:1 1 0;min-height:60px;display:flex;flex-direction:column}
#p2>.in{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
#p2 .in>.box{flex:none}
#p2 .in>.fl{flex:1 1 0;display:flex;flex-direction:column;min-height:0}
#p2 .fl>table{flex:1}
.pg input,.pg textarea{text-transform:uppercase}
.pg .bt{font-size:13px;line-height:1.4}
.rw{height:38px;display:flex;align-items:flex-start;gap:10px}.rw>b{padding-top:3px}
.pg [data-k="patient.last"],.pg [data-k="patient.first"],.pg [data-k="patient.middle"]{text-align:center}
.pg [data-k="admission.cr1"],.pg [data-k="admission.cr2"]{font-size:13px}
.pg [data-k="certification.name"]{font-size:14px;text-align:center}
.tabs{display:flex;gap:4px;margin-top:8px}.tb{border-radius:4px 4px 0 0;padding:6px 16px}.tb.on{background:var(--acc);color:#fff}
body.topr #cfw{display:none!important}body.tcf4 #opw{display:none!important}
#rem{position:fixed;right:12px;bottom:70px;width:300px;background:#fffbe6;color:#3a3200;border:1px solid #d4b106;border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 2px 10px #0003;z-index:6;display:none}#rem.on{display:block}#rem.err{background:#fff0ee;border-color:#c0392b;color:#5a1a12}#rem ul{margin:4px 0 0;padding-left:16px}#rem button{float:right;padding:0 7px;font-size:12px}#rem .bd{color:#b3231a;font-weight:bold}
.pg.op{display:block;padding:0;font:11.8pt/16.2pt Arial,Helvetica,sans-serif}
.pg.op>*{position:absolute;flex:none}
.pg.op .oc{left:0;width:612pt;text-align:center;white-space:nowrap;font-family:Georgia,'Times New Roman',serif}
.pg.op .ol{white-space:nowrap;height:16.2pt}
.pg.op .ohr{left:30.6pt;width:550.8pt;top:103.1pt;border-top:.75pt solid #000}
.pg.op .ottl{left:213.8pt;width:184.3pt;top:132.8pt;border-top:.75pt solid #000}
.pg.op input.oi{height:16pt;width:auto;border:0;border-bottom:.75pt solid #000;background:transparent;font:inherit;font-size:11pt;padding:0 3px;border-radius:0;min-width:0}
.pg.op input.oi:focus{background:#fff8c6}
.pg textarea.tx{font:13px/28.2667px Arial,Helvetica,sans-serif;padding:0;border:0;display:block;overflow:hidden;resize:none;background:transparent!important;white-space:pre-wrap;overflow-wrap:break-word}
.pg.op .rl{height:0;border-top:.75pt solid #000}
.pg.op textarea.ml{font-family:Arial,Helvetica,sans-serif;line-height:27.0667px;padding:0 3px;border:0;display:block;overflow:hidden;resize:none;background:transparent;width:auto;height:auto;border-radius:0}
.pg.op textarea.ml:focus{background:#fff8c6}
@media print{.pg input:focus,.pg textarea:focus{outline:0!important}.pg input:focus,.pg textarea:focus,.pg.op input.oi:focus,.pg.op textarea.ml:focus,.pg.op input.osgi:focus{background:transparent!important}#mzm{display:none!important}}
.pg.op .osg{left:419.9pt;top:856.4pt;width:161.5pt;height:34pt}.op-controls{width:612pt;text-align:center;padding:6px 0;display:flex;justify-content:center;gap:8px}.op-controls button{width:32px;height:28px;padding:0;font:bold 18px/26px Arial;border-radius:50%}.op-controls button.d{color:#b3412f;border-color:#b3412f}
.pg.op .osg>*{position:absolute}
.pg.op input.osgi{left:0;top:0;width:100%;height:18pt;border:0;border-bottom:.75pt solid #000;text-align:center;font:bold 12px Arial,sans-serif;padding:0;background:transparent;border-radius:0}
.pg.op input.osgi:focus{background:#fff8c6}
.pg.op .osl{left:0;right:0;top:16.6pt;text-align:center;white-space:nowrap}
.pg .bad{background:#ffd9d4!important;outline:1px solid #c0392b}
input[type=time].e{color:transparent}input[type=time].e:focus{color:#000}
@media print{
 html,body{background:#fff;margin:0}
 .ui,.noprint,.del,#toast,#rem{display:none!important}
 .sheet{display:block;padding:0;overflow:visible}
 body.tcf4 #p1,body.tcf4 #p2{display:flex!important}
 .bad{background:none!important;outline:0!important}#mz{display:none!important}
 body{padding:0!important}
 .pg{box-shadow:none;break-after:page;page-break-after:always;margin:0;overflow:hidden;height:1246px}
 .pg:last-child{break-after:auto;page-break-after:auto}
 input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{display:none}
}
body.s3.tcf4 .pg input,body.s3.tcf4 .pg textarea{pointer-events:none}
</style></head>

function fill(){
 document.querySelectorAll('[data-k]').forEach(e=>{const v=getP(e.dataset.k);if(e.type==='checkbox')e.checked=!!v;else e.value=String(v??'').toUpperCase()});
 document.querySelectorAll('input[type=date]').forEach(e=>e.classList.toggle('e',!e.value));
 document.querySelectorAll('input[type=time]').forEach(e=>e.classList.toggle('e',!e.value));
 document.querySelectorAll('[data-nm]').forEach(e=>e.value=fmtName());sync();validate();fitAll()}
function renderOpr(){$('#opw').innerHTML=oprHTML();fill()}
function fmtName(){const P=cf4Data.patient,m=(P.middle||'').trim();return [(P.last||'').trim(),[(P.first||'').trim(),m?m[0]+'.':''].filter(Boolean).join(' ')].filter(Boolean).join(', ')}
function parseName(v){const P=cf4Data.patient,i=v.indexOf(',');if(i<0){P.last=v.trim();return}
 P.last=v.slice(0,i).trim();const r=v.slice(i+1).trim().split(/\s+/).filter(Boolean);let mi='';
 if(r.length>1&&/^[A-Za-z]\.?$/.test(r[r.length-1]))mi=r.pop()[0].toUpperCase();
 P.first=r.join(' ');if(mi){if(!(P.middle||'').toUpperCase().startsWith(mi))P.middle=mi}else P.middle=''}
function sync(){const o=cf4Data.opr;document.querySelectorAll('[data-nmv]').forEach(e=>e.textContent=fmtName());document.querySelectorAll('[data-cn]').forEach(e=>e.textContent=(o.caseno||'').toUpperCase());document.querySelectorAll('[data-sg]').forEach(e=>{if(document.activeElement!==e)e.value=String(o.sig!==undefined?o.sig:(o.surgeon||'')).toUpperCase()})}
