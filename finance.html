<!-- ===== DOMAIN: pure functions (executed by Node tests) ===== -->
<script id="domain">
const PAD=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${PAD(d.getMonth()+1)}-${PAD(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const mins=t=>{if(!t||t==='-')return 0;const p=t.split(':');return parseInt(p[0])*60+parseInt(p[1])};  // payslip: timeStringToMinutes
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const fmt=c=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(c/100);
const toCents=s=>{const v=parseFloat(s);return isFinite(v)?Math.round(v*100):NaN};
function keyFromDocId(uid,id){if(!id.startsWith(uid+'_'))return null;const s=id.slice(uid.length+1);return DATE_RE.test(s)?s:null}
// payslip: activeDatesArray construction in period loader (same Date arithmetic, incl. overflow behaviour)
function periodDates(key){const[y,m,d]=key.split('-').map(Number);let s,e;
 if(d===15){s=new Date(y,m-2,29);e=new Date(y,m-1,13)}else{s=new Date(y,m-1,14);e=new Date(y,m-1,28)}
 const out=[];for(const c=new Date(s);c<=e;c.setDate(c.getDate()+1))out.push(ymd(c));return out}
// payslip: missingSettingsFields
function settingsMissing(d){const m=[];if(!d)return['ALL FIELDS'];const t=v=>(v||'').trim();
 if(!t(d.lastName))m.push('LAST NAME');if(!t(d.firstName))m.push('FIRST NAME');if(!t(d.emailAddress))m.push('ID NO.');

 <div class="field"><label for="f_title">TITLE</label><input id="f_title" placeholder="e.g. Lunch, electricity" value="${esc(dr.title??(t?t.title:""))}"></div>
 <div class="field"><label>CATEGORY</label><div class="category-picks">${list.map(c=>`<button class="${m.cat===c.id?"selected":""}" data-act="mcat" data-k="${c.id}">${c.icon} ${esc(c.name)}</button>`).join("")}</div></div>
 <div class="field-grid"><div class="field"><label for="f_date">DATE</label><input id="f_date" type="date" value="${d}"></div><div class="field"><label for="f_acc">ACCOUNT</label><select id="f_acc">${S.accts.map(a=>`<option value="${a.id}"${(t?t.accountId:(isInc(m.kind)?"acct_bank":"acct_cash"))===a.id?" selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
 <div class="field"><label for="f_mer">MERCHANT / SOURCE</label><input id="f_mer" placeholder="Optional" value="${esc(dr.mer??(t?t.merchant||"":""))}"></div>${t?"":`<div class="field"><label for="f_rep">REPEAT</label><select id="f_rep"><option value="">Does not repeat</option><option value="monthly">Every month</option></select></div>`}</div>
 <div class="field"><label for="f_notes">NOTES (OPTIONAL)</label><textarea id="f_notes" rows="2">${esc(dr.notes??(t?t.notes||"":""))}</textarea></div>
 <div class="form-note" id="f_status"></div><div class="exp expense" id="f_err" style="color:var(--expense);font-size:12px"></div>
 <div class="form-actions"><button class="outline-btn" data-act="closeModal">Cancel</button><button class="primary-btn" id="f_save" data-act="saveTx">Save transaction</button></div>
 <div class="form-actions" style="margin-top:8px">${!t?'<button class="quiet-btn" data-act="mtransfer">Move money between accounts</button>':`${t.status==="scheduled"?'<button class="outline-btn" data-act="mpaid">Mark as paid / received</button>':""}<button class="danger-btn" data-act="mdel">Delete</button>`}</div>`;
 const up=()=>{const dv=v("f_date"),sc=m.kind.startsWith("scheduled")||dv>today();document.getElementById("f_status").textContent=sc?"Will be recorded as a scheduled "+(isInc(m.kind)?"income":"expense")+". It won't change your balance until you mark it paid.":"Will be recorded as a posted "+(isInc(m.kind)?"income":"expense")+".";m.date=dv};
 document.getElementById("f_date").oninput=up;up()}
function transferForm(){const a=S.accts;if(a.length<2)return toast("You need two accounts to transfer.");
 $("#modalBox").innerHTML=`<div class="modal-head"><h2>Move money</h2><button class="icon-btn" data-act="closeModal" aria-label="Close">×</button></div><div class="amount-wrap"><span>₱</span><input id="t_amt" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
 <div class="field-grid"><div class="field"><label>FROM</label><select id="t_from">${a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>TO</label><select id="t_to">${a.map((x,i)=>`<option value="${x.id}"${i===1?" selected":""}>${esc(x.name)}</option>`).join("")}</select></div></div>
 <div class="field"><label>DATE</label><input id="t_date" type="date" value="${today()}"></div><div class="form-note">Transfers don't count as income or spending.</div><div id="f_err" style="color:var(--expense);font-size:12px"></div>
 <div class="form-actions"><button class="outline-btn" data-act="closeModal">Cancel</button><button class="primary-btn" data-act="saveTransfer">Move money</button></div>`}
const closeModal=()=>{$("#modal").classList.remove("open");S.M=null};
async function saveTransfer(){const amt=toCents(v("t_amt")),fr=v("t_from"),to=v("t_to"),date=v("t_date"),er=$("#f_err");if(!(amt>0))return er.textContent="Enter an amount above 0.";if(fr===to)return er.textContent="Pick two different accounts.";
 try{const g=doc(C("transactions")).id,st=statusFor(date,today()),b=writeBatch(db);
  b.set(doc(C("transactions")),mk({kind:"transfer",dir:"out",title:"Transfer to "+aname(to),amountCentavos:amt,accountId:fr,date,status:st,transferGroupId:g}));
  b.set(doc(C("transactions")),mk({kind:"transfer",dir:"in",title:"Transfer from "+aname(fr),amountCentavos:amt,accountId:to,date,status:st,transferGroupId:g}));await b.commit();closeModal();toast("Moved.")}catch(e){er.textContent=errMsg(e,"transactions")}}
async function saveTx(){const m=S.M,btn=$("#f_save"),er=$("#f_err");er.textContent="";const amt=toCents(v("f_amt")),date=v("f_date"),kind=isInc(m.kind)?"income":"expense";
 if(!(amt>0))return er.textContent="Enter an amount above 0.";if(!S.accts.length)return er.textContent="Set up your accounts first.";if(!DATE_RE.test(date))return er.textContent="Pick a date.";
 const sched=m.kind.startsWith("scheduled"),status=sched?"scheduled":statusFor(date,today()),acc=v("f_acc"),f={kind,title:v("f_title")||(kind==="income"?"Income":"Expense"),amountCentavos:amt,categoryId:m.cat,accountId:acc,date,merchant:v("f_mer"),notes:v("f_notes"),status,incomeClass:kind==="income"?incClass(m.cat):null,updatedAt:serverTimestamp()};
 btn.disabled=true;
 try{if(m.id){await updateDoc(P("transactions",m.id),{...f,postedDate:status==="posted"?(m.t.postedDate||date):null})}
  else{const b=writeBatch(db),rep=document.getElementById("f_rep").value;
   if(rep){const rr=doc(C("recurring_rules")),rule={id:rr.id,frequency:rep,interval:1,start:date};b.set(rr,{...rule,kind,title:f.title,amountCentavos:amt,categoryId:m.cat,accountId:acc,schemaVersion:SV,userId:uid});
    for(const o of occurrences(rule,date,addDays(today(),90)))b.set(P("transactions",o.id),mk({...f,date:o.date,status:"scheduled",source:"recurring",recurringRuleId:rr.id,occurrenceKey:o.id}),{merge:true})}
   else b.set(doc(C("transactions")),mk({...f,postedDate:status==="posted"?date:null}));await b.commit()}
  closeModal();toast("Saved.")}
 catch(e){er.textContent="Couldn't save. "+errMsg(e,"transactions");btn.disabled=false}}
const markPaid=async id=>{try{await runTransaction(db,async tr=>{const r=P("transactions",id),s=await tr.get(r);if(!s.exists())return;const n=applyMarkPaid(s.data(),today());if(n)tr.update(r,{status:"posted",postedDate:n.postedDate,updatedAt:serverTimestamp()})});closeModal();toast("Marked as paid.")}catch(e){toast(errMsg(e,"transactions"))}};
const softDel=async id=>{try{await updateDoc(P("transactions",id),{deletedAt:Date.now()});closeModal();toast("Deleted.",()=>updateDoc(P("transactions",id),{deletedAt:null}))}catch(e){toast(errMsg(e,"transactions"))}};
async function delTransfer(){const t=S.M.t,ids=S.txs.filter(x=>x.transferGroupId===t.transferGroupId).map(x=>x.id);try{const b=writeBatch(db);ids.forEach(i=>b.update(P("transactions",i),{deletedAt:Date.now()}));await b.commit();closeModal();toast("Transfer deleted.",()=>{const u=writeBatch(db);ids.forEach(i=>u.update(P("transactions",i),{deletedAt:null}));u.commit()})}catch(e){toast(errMsg(e,"transactions"))}}
// ---------- salary / settings actions ----------
async function confirmSalary(key){const p=S.salary.periods.find(x=>x.key===key),amt=toCents(v("amt_"+key)),date=v("dt_"+key),acc=S.accts.find(a=>a.id==="acct_bank")||S.accts[0];
 if(!acc)return toast("Set up your accounts first.");if(!(amt>0))return toast("Enter the amount received.");
 const bd={basic:p.calc.basic,overtime:p.calc.overtime,incentives:p.calc.incentives.total,deductions:p.calc.deductions.total,net:p.calc.net};
 try{await runTransaction(db,async tr=>{const r=P("transactions","salary_"+key),s=await tr.get(r);if(s.exists()&&s.data().status==="posted"&&!s.data().deletedAt)return;   // idempotent: one record per period
  tr.set(r,mk({kind:"income",status:"posted",title:"Salary "+key,amountCentavos:amt,categoryId:"cat_salary",accountId:acc.id,date,postedDate:date,incomeClass:"salary",source:"salary_sync",sourceId:uid,periodId:key,breakdown:bd}));
  tr.set(P("salary_links",key),{status:"confirmed",confirmedAmountCentavos:amt,payslipNetAtConfirm:p.calc.net,payslipUpdatedAtAtConfirm:p.rec.updatedAt||null,receivedDate:date,schemaVersion:SV,userId:uid})});toast("Salary recorded.")}
 catch(e){toast(errMsg(e,"salary"))}}
const applyChange=async key=>{const p=S.salary.periods.find(x=>x.key===key),bd={basic:p.calc.basic,overtime:p.calc.overtime,incentives:p.calc.incentives.total,deductions:p.calc.deductions.total,net:p.calc.net};
 try{await runTransaction(db,async tr=>{const r=P("transactions","salary_"+key),s=await tr.get(r);if(!s.exists())return;tr.update(r,{amountCentavos:p.calc.net,breakdown:bd,notes:(s.data().notes||"")+` [${today()} payslip update: ${fmt(s.data().amountCentavos)} → ${fmt(p.calc.net)}]`});tr.update(P("salary_links",key),{payslipNetAtConfirm:p.calc.net,confirmedAmountCentavos:p.calc.net})});toast("Applied.")}catch(e){toast(errMsg(e,"salary"))}};
const keepChange=key=>setDoc(P("salary_links",key),{payslipNetAtConfirm:S.salary.periods.find(x=>x.key===key).calc.net},{merge:true});
const saveBudget=()=>setDoc(P("settings","main"),{reserve:toCents(v("b_res"))||0,monthly:toCents(v("b_mon"))||0,countIn:document.getElementById("b_in").checked,schemaVersion:SV,userId:uid},{merge:true}).then(()=>toast("Saved."));
async function saveOB(){try{for(const a of S.accts){const c=toCents(v("ob_"+a.id));if(!isNaN(c))await updateDoc(P("accounts",a.id),{startCentavos:c})}toast("Saved.")}catch(e){toast(errMsg(e,"accounts"))}}
async function diag(){const r=[],t=async(n,f)=>{try{await f();r.push([n,"pass"])}catch(e){r.push([n,e.code==="permission-denied"?`permission-denied on ${n}: check Firestore rules`:"fail: "+(e.code||e.message)])}};
 await t("accounts/"+uid,()=>getDoc(doc(db,"accounts",uid)));await t("salary_settings/"+uid,()=>getDoc(doc(db,"salary_settings",uid)));
 await t("salary_transactions (range)",()=>getDocs(query(collection(db,"salary_transactions"),where(documentId(),">=",uid+"_"),where(documentId(),"<",uid+"_\uf8ff"))));
 await t("finance settings/_ping write+read+delete",async()=>{const p=P("settings","_ping");await setDoc(p,{t:Date.now()});await getDoc(p);await deleteDoc(p)});
 r.push(["offline persistence",persist?"enabled":"unavailable"]);S.diag=r;render()}
async function wipe(){if(v("w_txt")!=="DELETE")return toast("Type DELETE to confirm.");try{for(const n of["transactions","accounts","categories","recurring_rules","salary_links","settings"]){const s=await getDocs(C(n));for(const d of s.docs)await deleteDoc(d.ref)}S.set={reserve:0,monthly:0,countIn:false};location.hash="#/home";toast("Finance data deleted.")}catch(e){toast(errMsg(e,"finance data"))}}
const dl=(n,t,ty)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
// ---------- router / render ----------
const route=()=>{const p=location.hash.replace(/^#\//,"").split("?")[0].split("/");return{r:["home","calendar","search","settings"].includes(p[0])?p[0]:"home",sub:p[1]}};
function render(){const{r,sub}=route(),el=$("#view"),setup=S.loaded.accounts&&S.loaded.settings&&!S.set.setupDone&&!S.accts.length;
 $("#syncLabel").textContent=S.sync;const nm=(S.profile.customName||S.profile.username||localStorage.getItem("userName")||"").trim();$("#avatar").textContent=nm?nm.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase():"•";$("#periodSelect").value=S.period;
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.nav===r));$("#fab").style.display=r==="settings"||setup?"none":"flex";
 const ae=document.activeElement,keep=ae&&ae.id==="searchInput"?ae.selectionStart:null;
 if(!S.loaded.transactions&&!S.err){el.innerHTML='<div class="card"><div class="empty"><div class="empty-icon">◌</div><strong>Loading…</strong></div></div>';return}
 if(document.activeElement&&/^(s_|ob_|b_|w_|amt_|dt_)/.test(document.activeElement.id||""))return;   // don't wipe a field being typed in
 if(setup){el.innerHTML=setupView();return}
 if(r==="search")parseQ();
 el.innerHTML=r==="home"?home():r==="calendar"?calendar():r==="search"?search():settings(sub);
 if(keep!==null){const q=document.getElementById("searchInput");q.focus();q.setSelectionRange(keep,keep)}}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});
document.addEventListener("input",e=>{if(e.target.id==="searchInput"){clearTimeout(render.t);render.t=setTimeout(()=>{S.q.text=e.target.value;render()},200)}});
document.addEventListener("change",e=>{const i=e.target.id;if(i==="periodSelect"){S.period=e.target.value;render()}else if(i==="catFilter"){S.q.cat=e.target.value;render()}else if(i==="sortFilter"){S.q.sort=e.target.value;render()}else if(i==="themeSel"){localStorage.setItem("fin_theme",e.target.value);theme(e.target.value)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.act==="edit")e.target.click();if(e.key==="Escape")closeModal()});
document.addEventListener("click",e=>{
 if(e.target.id==="modal"){closeModal();return}
 const g=e.target.closest("[data-go]");if(g&&!e.target.closest("[data-act]")){S.q={...S.q,type:g.dataset.type||"all",cat:g.dataset.cat||"all"};S.shown=0;location.hash="#/search";return}
 const nv=e.target.closest("[data-nav]");if(nv){location.hash="#/"+nv.dataset.nav;return}
 const a=e.target.closest("[data-act]");if(!a)return;const d=a.dataset;
 ({add:()=>openModal(null,d.d,d.k),edit:()=>{const t=S.txs.find(x=>x.id===d.id);if(t)openModal(t)},closeModal,saveTx,saveTransfer,mtransfer:transferForm,
  mkind:()=>{const g=i=>(document.getElementById(i)||{}).value;S.M.draft={amt:g("f_amt"),title:g("f_title"),mer:g("f_mer"),notes:g("f_notes")};S.M.kind=d.k;renderModal(S.M.t)},mcat:()=>{S.M.cat=d.k;document.querySelectorAll(".category-picks button").forEach(b=>b.classList.toggle("selected",b.dataset.k===d.k))},
  mpaid:()=>markPaid(S.M.id),mdel:()=>softDel(S.M.id),delTransfer,
  confirm:()=>confirmSalary(d.k),notyet:()=>toast("OK, it stays pending."),apply:()=>applyChange(d.k),keep:()=>keepChange(d.k),
  acctchip:()=>{S.acct=d.k;render()},bills:()=>{const b=$("#bills");b.style.display=b.style.display==="none"?"block":"none";a.textContent=b.style.display==="none"?"Show bills +":"Hide bills −"},
  barinfo:()=>toast("Available funds = carried over + income received. Transfers excluded."),
  calprev:()=>{S.cal.m--;if(S.cal.m<0){S.cal.m=11;S.cal.y--}render()},calnext:()=>{S.cal.m++;if(S.cal.m>11){S.cal.m=0;S.cal.y++}render()},caltoday:()=>{const n=new Date();S.cal={...S.cal,y:n.getFullYear(),m:n.getMonth(),sel:today()};render()},calmode:()=>{S.cal.mode=d.k;render()},calsel:()=>{S.cal.sel=d.d;render()},
  qtype:()=>{S.q.type=d.k;render()},qclear:()=>{S.q={text:"",type:"all",cat:"all",sort:"newest"};location.hash="#/search";render()},more:()=>{S.shown=(S.shown||30)+30;render()},
  sub:()=>location.hash="#/settings/"+d.k,back:()=>location.hash="#/settings",
  recv:()=>{S.setup.recv=d.k==="1";document.querySelectorAll('[data-act="recv"]').forEach(b=>b.classList.toggle("active",b.dataset.k===d.k))},
  saveSetup:()=>saveSetup(false),skipSetup:()=>saveSetup(true),saveBudget,saveOB,diag,wipe,refreshSalary:loadSalary,
  exportJson:()=>dl("finance_export.json",JSON.stringify({accounts:S.accts,transactions:S.txs},null,1),"application/json"),
  exportCsv:()=>dl("finance_export.csv",["date,kind,status,title,category,account,amount"].concat(live_().map(t=>[t.date,t.kind,t.status,'"'+(t.title||"").replace(/"/g,'""')+'"',cat(t.categoryId).name,aname(t.accountId),(t.amountCentavos/100).toFixed(2)].join(","))).join("\n"),"text/csv")}[d.act]||(()=>{}))()});
render();
</script>
</body>
</html>
